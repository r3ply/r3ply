<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ section.title | default(value=config.title) }}</title>
  <link rel="stylesheet" href="style.css">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="r3ply" />

</head>
<body class="bg-green-50 dark:bg-slate-950 bg-[url(/patterns/bank-note.svg)] dark:bg-[url(/patterns/bank-note_dark.svg)]">

  <div class="w-24 h-24 text-green-500 dark:text-slate-200

  bg-no-repeat bg-contain bg-center">
</div>
  <main class="py-6">
    <article class="px-4 md:px-0 mx-auto prose prose-neutral prose-pink dark:prose-invert prose-li:marker:text-black dark:prose-li:marker:text-neutral-300 prose-hr:border-black dark:prose-hr:border-gray-400">
      {{ section.content | safe }}
    </article>
  </main>
