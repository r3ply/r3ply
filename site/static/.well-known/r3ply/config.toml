# r3ply configuration - see /docs for more
version = "0.0.1"

# each site x r3ply combo has an entry
[[site]]
domain = "example.com"
r3ply = "r3ply.com"
signet = "iSQIIBcF7ka2UURJpFDkYw"
issued = 2025-08-26

# generated by running `re init`
[[site]]
domain = "site.local.test"
r3ply = "cli.r3ply.test"
signet = "uV9NgkYqTol24KdUo3D4HQ"
issued = 2025-08-27

# more moderation options, e.g. `type = "webhook"`, available
[comments.email.moderation]
type = "github"
repo = "https://github.com/you/<YOUR_REPO>"
"file_path_{}" = "content/comments/{{ comment.id[:8] }}.md"

[comments.email]
"comment_{}" = """
<!-- Comment Details:
  version = {{ r3ply.config_version }}
  server = {{ r3ply.server }}
  site = {{ r3ply.site }}
  signet = {{ r3ply.signet }}
  issued = {{ r3ply.issued }}
  author_token: {{ author.token }}
  author_pseudonym: {{ author.pseudonym }}
-->

<div class="comment" id="{{ comment.id[:12] }}">
  <div class="meta">
    <span class="author">{{ author.pseudonym[:8] }}</span> ·
    <time datetime="{{ email.date }}">{{ email.date }}</time>
  </div>
  <div class="content">
    {{ comment.html }}
  </div>
  <div class="subject">
    <a href="{{ comment.subject.url }}">View subject</a>
  </div>
</div>
"""
