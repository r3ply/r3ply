[package]
name = "r3ply-wasm"
version = "0.0.1"
edition = "2021"

[dependencies]
ammonia = "4.0.0"
html-escape = "0.2.13"
mail-builder = { version = "0.4.2", default-features = false }
mail-parser = { version = "0.9.1", features = ["serde_support"] }
pulldown-cmark = "0.13.0"
serde = { version = "1.0.219", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.140"
# rev 42b5efc is from the branch "components"
tera = { git = "https://github.com/asimpletune/tera2", rev = "42b5efc" }
tera-contrib = { git = "https://github.com/asimpletune/tera2", rev = "42b5efc", features = ["date", "urlencode", "json"] }
wasm-bindgen = "0.2.100"

[lib]
crate-type = ["cdylib", "rlib"]
